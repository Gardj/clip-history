<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Буфер</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="window">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="5" width="12" height="16" rx="2.5"/><path d="M9 5V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1M10 10h6M10 14h6M10 18h4"/><path d="M4 8v11a2 2 0 0 0 2 2"/></svg>
          </div>
          <div><h1>Буфер</h1><p class="subtitle">История скопированного</p></div>
        </div>
        <div class="top-actions">
          <label class="search-box" id="search-box" aria-label="Поиск по истории">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4 4"/></svg>
            <input id="search" type="search" placeholder="Найти в истории" autocomplete="off" />
            <kbd>⌘ F</kbd>
          </label>
          <button id="close" class="icon-button" title="Скрыть окно (Esc)" aria-label="Скрыть окно"><svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>
      </header>

      <nav class="tabs" aria-label="Разделы">
        <button class="tab active" data-view="history-view">История</button>
        <button class="tab" data-view="settings-view">Настройки</button>
      </nav>

      <section id="history-view" class="view active">
        <div class="toolbar">
          <div class="section-label"><span class="live-dot"></span><span id="count-label">Последнее</span></div>
          <div class="toolbar-actions">
            <button id="pause" class="text-button"><span class="pause-glyph">Ⅱ</span><span>Пауза</span></button>
            <button id="clear" class="text-button clear-button" title="Удалить всю историю"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m3 0-.8 12.2a1 1 0 0 1-1 .8H7.8a1 1 0 0 1-1-.8L6 7m4 4v5m4-5v5"/></svg><span>Очистить</span></button>
          </div>
        </div>
        <section id="history" class="history" aria-live="polite"></section>
      </section>

      <section id="settings-view" class="view settings-view">
        <div class="settings-heading"><span class="live-dot"></span><div><h2>Настройки</h2><p>Оформление и хранение истории</p></div></div>
        <div class="settings-list">
          <label class="setting-row"><span><strong>Тема</strong><small>Оформление окна приложения</small></span><select id="theme-setting"><option value="system">Системная</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
          <label class="setting-row"><span><strong>Размер окна</strong><small>Размер панели истории</small></span><select id="size-setting"><option value="compact">Компактный</option><option value="standard">Обычный</option><option value="wide">Большой</option></select></label>
          <label class="setting-row"><span><strong>Положение окна</strong><small>Где показывать окно на экране</small></span><select id="position-setting"><option value="top-left">Сверху слева</option><option value="top-center">Сверху по центру</option><option value="top-right">Сверху справа</option><option value="center-left">Слева по центру</option><option value="center">По центру</option><option value="center-right">Справа по центру</option><option value="bottom-left">Снизу слева</option><option value="bottom-center">Снизу по центру</option><option value="bottom-right">Снизу справа</option></select></label>
          <label class="setting-row"><span><strong>Количество записей</strong><small>Максимум элементов в истории</small></span><select id="count-setting"><option value="50">50</option><option value="100">100</option><option value="250">250</option><option value="500">500</option></select></label>
          <label class="setting-row"><span><strong>Лимит хранилища</strong><small>Общий размер данных в истории</small></span><select id="storage-setting"><option value="250">250 МБ</option><option value="1024">1 ГБ</option><option value="5120">5 ГБ</option><option value="0">Не ограничивать</option></select></label>
          <label class="setting-row"><span><strong>Срок хранения</strong><small>Автоматически удалять старые записи</small></span><select id="age-setting"><option value="7">7 дней</option><option value="30">30 дней</option><option value="90">90 дней</option><option value="365">1 год</option><option value="0">Не удалять</option></select></label>
          <label class="setting-row"><span><strong>Запуск при входе</strong><small>Открывать Clip History после входа в macOS</small></span><input id="autostart-setting" class="switch" type="checkbox" /></label>
        </div>
        <p id="settings-status" class="settings-status" role="status"></p>
      </section>

      <footer class="footer">
        <div class="privacy-note"><span class="lock-icon">◆</span> История хранится только на этом Mac</div>
        <div class="shortcut-hint"><kbd>⌘⇧V</kbd><span>показать</span><kbd>↵</kbd><span>в буфер</span><kbd>esc</kbd><span>скрыть</span></div>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
